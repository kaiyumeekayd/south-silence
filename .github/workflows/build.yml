name: Build South Silence PS1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Compilar South Silence
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/source" \
            -w /source \
            luksamuk/psxtoolchain:latest \
            /bin/bash -c "set -x; echo '=== ARQUIVOS DO PROJETO ==='; find . -maxdepth 3 -type f; echo '=== VARIAVEIS PSN00BSDK ==='; env | grep PSN00BSDK || true; echo '=== CMAKE ==='; cmake --version; echo '=== CONFIGURANDO ==='; cmake --preset default; echo '=== COMPILANDO ==='; cmake --build build; echo '=== RESULTADO ==='; find . -maxdepth 3 -type f"

      - name: Verificar arquivos
        run: |
          echo "Arquivos produzidos:"
          find build -type f 2>/dev/null || true

      - name: Salvar arquivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: south-silence-build
          path: build/
          if-no-files-found: error
